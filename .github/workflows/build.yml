name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files into Android project layout
        run: |
          mkdir -p app/src/main/java/com/example/hififx
          mv Fx.kt EffectService.kt MainActivity.kt app/src/main/java/com/example/hififx/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HiFiFx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
